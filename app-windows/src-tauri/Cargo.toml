[package]
name = "mydiskisfull-app"
version = "0.1.6"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.90"
publish = false
description = "MyDiskIsFull for Windows: the tray icon and the window, over `mdif`"

# A workspace of its own: the command line's builds and tests (and its offline
# cache on a Mac) don't take the app's dependencies in.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
# Windows' own TLS (SChannel) and proxy settings: no TLS library of its own
# to build, and no zip (a Windows update is the installer itself).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
# The plugin's own HTTP client, to tell a release without the feed (404)
# from GitHub failing: the plugin says the same for both.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
# Versions compared (what's news after a release is withdrawn); the
# updater's own.
semver = "1.0.28"
# Where the updater writes the installer (tempfile's folder, set to the app's
# own just before): what's left there after an update is the update's alone.
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The updater's own signature check, for release.yml's check of the feed.
[dev-dependencies]
minisign-verify = "0.3"
base64 = "0.23"

# The command line's own Run-key code (per user, the command quoted, Task
# Manager's switch read), for opening the app at sign-in.
[target.'cfg(windows)'.dependencies]
mdif-windows = { path = "../../crates/mdif-windows" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
