name: Bug report
description: Something measured wrong, crashed, or did something it shouldn't
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If MyDiskIsFull deleted, moved or downloaded something it shouldn't have, please report it
        privately instead (Security → Report a vulnerability).
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.0.1 (run: sw_vers -productVersion)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mdif version
      placeholder: "run: mdif --version"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
      description: The command, and the output (trim paths you'd rather not share).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
