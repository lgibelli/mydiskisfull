name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked

  test:
    name: test (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke test on the runner's own disk
        run: |
          ./target/release/mdif --version
          ./target/release/mdif map --root "$HOME" --depth 1 --min-mb 100
          ./target/release/mdif writers --secs 2 --top 5
          ./target/release/mdif watch --once --db "$RUNNER_TEMP/smoke.sqlite3"
          ./target/release/mdif forecast --db "$RUNNER_TEMP/smoke.sqlite3"
          ./target/release/mdif suggest --db "$RUNNER_TEMP/smoke.sqlite3"
          ./target/release/mdif tweaks --db "$RUNNER_TEMP/smoke.sqlite3"
      # The runner is thrown away afterwards, so a real tweak can be applied to it.
      - name: Apply and revert a tweak on the runner
        run: |
          db="$RUNNER_TEMP/tweaks.sqlite3"
          mdif=./target/release/mdif
          read_it() { defaults read com.apple.finder FXRemoveOldTrashItems 2>/dev/null || echo unset; }
          before=$(read_it)
          $mdif tweaks apply trash-auto-empty --dry-run --db "$db"
          test "$(read_it)" = "$before"
          $mdif tweaks apply trash-auto-empty --db "$db"
          test "$(read_it)" = 1
          $mdif tweaks --json --db "$db" | jq -e '.[] | select(.id == "trash-auto-empty")
            | .status == "applied" and .applied != null'
          $mdif tweaks revert trash-auto-empty --db "$db"
          test "$(read_it)" = "$before"
          # Nothing left to revert: refused.
          if $mdif tweaks revert trash-auto-empty --db "$db"; then exit 1; fi

  e2e:
    name: e2e (real filler, churner, cleanup)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p mdif-core --test e2e_watch -- --ignored --nocapture

  budget:
    name: watcher budget (measured)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # One owners period every 6 samples, the same ratio as the defaults (5 min, 30 min).
      - name: Sample every 5 s for 2 minutes, then check the cost at the default 5 minutes
        run: |
          db="$RUNNER_TEMP/budget.sqlite3"
          ./target/release/mdif watch --quiet --interval 5 --owners-every 30 --db "$db" &
          sleep 120
          kill %1
          ./target/release/mdif forecast --db "$db"
          ./target/release/mdif owners --db "$db" --hours 1
          ./target/release/mdif incidents --db "$db"
          # At the defaults an hour is 12 samples and 2 folder updates.
          ./target/release/mdif forecast --db "$db" --json | jq -e '.watcher_cost
            | .samples >= 20
              and .periods >= 1
              and .cpu_us_per_sample * 12 + .cpu_us_per_period * 2 < 1000000
              and .written_per_sample * 12 < 1000000'

  app:
    name: app (bundle + JSON contract)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No release.env here, so the bundle is signed adhoc.
      - run: app/build.sh
      - name: The bundle is complete and signed
        run: |
          app=build/MyDiskIsFull.app/Contents
          test -x "$app/MacOS/MyDiskIsFull"
          "$app/MacOS/mdif" --version
          plutil -lint "$app/Info.plist" "$app/Library/LaunchAgents/io.github.lgibelli.mydiskisfull.watcher.plist"
          test "$(plutil -extract BundleProgram raw "$app/Library/LaunchAgents/io.github.lgibelli.mydiskisfull.watcher.plist")" = Contents/MacOS/mdif
          # Sparkle: embedded, linked, and a feed and key to check against.
          test -d "$app/Frameworks/Sparkle.framework"
          otool -L "$app/MacOS/MyDiskIsFull" | grep -q "@rpath/Sparkle.framework"
          plutil -extract SUFeedURL raw "$app/Info.plist" | grep -q "^https://github.com/lgibelli/mydiskisfull/releases/latest/download/appcast.xml$"
          test -n "$(plutil -extract SUPublicEDKey raw "$app/Info.plist")"
          codesign --verify --deep --strict build/MyDiskIsFull.app
      - run: app/check-contract.sh
      - name: The App Store edition is sandboxed, leaves the tweaks out and links the full version
        run: |
          app/build.sh --app-store
          lite="build/AppStore/MyDiskIsFull Lite.app"
          codesign --verify --deep --strict "$lite"
          # The app and the mdif it runs, in the App Sandbox; mdif inherits it.
          codesign -d --entitlements - --xml "$lite" | plutil -extract 'com\.apple\.security\.app-sandbox' raw - | grep -q true
          codesign -d --entitlements - --xml "$lite/Contents/MacOS/mdif" | plutil -extract 'com\.apple\.security\.inherit' raw - | grep -q true
          # The watcher runs inside the app: no LaunchAgent.
          test ! -e "$lite/Contents/Library/LaunchAgents"
          test "$(plutil -extract CFBundleName raw "$lite/Contents/Info.plist")" = "MyDiskIsFull Lite"
          full=build/MyDiskIsFull.app/Contents/MacOS/MyDiskIsFull
          store="$lite/Contents/MacOS/MyDiskIsFull"
          # Text only the tweak flow has: in the full edition, not compiled into the other.
          strings "$full" | grep -q "so Undo puts it back"
          if strings "$store" | grep -q "so Undo puts it back"; then exit 1; fi
          # The same for clean-ups: the store edition may only read the disk.
          strings "$full" | grep -q "once you empty the Trash"
          if strings "$store" | grep -q "once you empty the Trash"; then exit 1; fi
          strings "$full" | grep -q "Asking Docker what it can remove"
          if strings "$store" | grep -q "Asking Docker what it can remove"; then exit 1; fi
          # Asking AI: the store edition has no network entitlement for it.
          strings "$full" | grep -q "which asks Claude, Anthropic's AI"
          if strings "$store" | grep -q "which asks Claude, Anthropic's AI"; then exit 1; fi
          strings "$store" | grep -q "Get the Free Full Version"
          # The App Store updates it: no Sparkle, no feed.
          test ! -e "$lite/Contents/Frameworks/Sparkle.framework"
          if plutil -extract SUFeedURL raw "$lite/Contents/Info.plist" 2>/dev/null; then exit 1; fi

  worker:
    name: Ask AI's Worker
    runs-on: macos-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # Types, then the Worker under wrangler dev with a stand-in for
      # Anthropic's API: nothing is asked for real.
      - run: npm run check
      - run: npm test

  intel:
    name: build (Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-apple-darwin

  msrv:
    name: MSRV (1.88)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
