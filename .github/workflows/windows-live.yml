name: Windows, live

# What needs the published releases, so not part of CI: the app updating
# itself from the release before the latest to the latest (its own Check Now
# and Install and Restart), and Storage Sense emptying the bin once the bin
# tweak is applied. Run it after publishing a release: gh workflow run
# windows-live.yml. A pull request that changes it runs it too.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-live.yml
      - app-windows/tests/live_*.py

permissions:
  contents: read

jobs:
  update:
    name: update from the previous release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install comtypes==1.4.8 pillow==11.3.0
      - name: Install the previous release, look through it, update it from the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python app-windows/tests/live_update.py ${{ matrix.arch }}
      - name: What the window showed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}-screens
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  storage-sense:
    name: Storage Sense empties the bin (Windows 11)
    strategy:
      fail-fast: false
      matrix:
        # Windows 11 only: Windows Server has no Storage Sense page to run it from.
        include:
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install comtypes==1.4.8 pillow==11.3.0
      - name: Apply the bin tweak, bin two files, run Storage Sense
        env:
          GH_TOKEN: ${{ github.token }}
        run: python app-windows/tests/live_storage_sense.py ${{ matrix.arch }}
      - name: What Settings showed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-sense-screens
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
