name: Release (signed DMG, draft; Lite to App Store Connect)

# Builds, signs, notarizes and packages the full edition (app/release.sh),
# attests its provenance, and puts it on a *draft* GitHub release for a person
# to publish; and builds MyDiskIsFull Lite from the same commit, signs it for
# the Mac App Store and uploads it to App Store Connect (app/app-store.sh),
# where it shows in TestFlight once it's processed. Anyone can check that a
# download came from this repository and commit:
#
#   gh attestation verify MyDiskIsFull-0.1.0.dmg --repo lgibelli/mydiskisfull
#
# It holds the signing keys, so it runs only on a push to a release/** branch
# (which a fork can't create) or by hand, never on pull requests.
#
# Release flow: bump the version in Cargo.toml, turn CHANGELOG's Unreleased
# into "## [x.y.z] - date", push, then push a release/x.y.z branch. The full
# edition alone, with nothing uploaded to App Store Connect:
#
#   gh workflow run release.yml --ref main -f lite=false
#
# The Windows installers (x64 and ARM64, unsigned until a certificate is
# chosen: docs/RELEASING.md) go on the same draft only when asked for, since
# the Windows edition isn't released yet:
#
#   gh workflow run release.yml --ref main -f windows=true
#
# Secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID Application
#                                                certificate, exported as .p12
#   APPLE_API_KEY_B64, APPLE_API_KEY_ID,         an App Store Connect API key
#   APPLE_API_ISSUER                             for notarytool
#   SPARKLE_ED_PRIVATE_KEY                       generate_keys --account
#                                                io.github.lgibelli.mydiskisfull -x
#   MAS_APP_P12_BASE64, MAS_INSTALLER_P12_BASE64, the Apple Distribution and Mac
#   MAS_P12_PASSWORD                             Installer identities, each with
#                                                Apple's WWDR G3 intermediate
#   MAS_PROFILE_BASE64                           Lite's Mac App Store profile
#   TAURI_SIGNING_PRIVATE_KEY                    the Windows app's updater key
#                                                (login keychain, service
#                                                https://v2.tauri.app/plugin/updater)
# Variables: APPLE_TEAM_ID, APP_STORE_BUNDLE_ID.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      lite:
        description: Upload MyDiskIsFull Lite to App Store Connect too
        type: boolean
        default: true
      windows:
        description: Put the Windows installers (unsigned) on the draft too
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # Sigstore, for the provenance attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release # add required reviewers in Settings → Environments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # actool reads the icon's layers (an .icon) from Xcode 26, and on macOS 15
      # not even then: the app got an .icns that macOS 26 shows in a grey frame
      # (0.1.1). release.sh and app-store.sh now stop instead.
      - name: Use Xcode 26 or later if the runner has it
        run: |
          # A released Xcode, never a beta or a release candidate.
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Import the signing identity into a throwaway keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the notary and Sparkle keys
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::SPARKLE_ED_PRIVATE_KEY is not set"; exit 1; }
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"

      - name: Build, sign, notarize and package
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-key
        run: app/release.sh

      # A signed statement in Sigstore's public log binding these bytes to
      # this workflow, repository and commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/MyDiskIsFull-*.dmg
            build/release/MyDiskIsFull.dmg
            build/release/mdif-*.tar.gz

      - name: Put it on a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The windows job uploads a feed of its own: none is carried over.
          WINDOWS_FEED_FOLLOWS: ${{ inputs.windows }}
        # It also keeps the Windows update feed on the draft (keep-feed.sh)
        # when there is no windows job.
        run: app/release.sh --upload

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-key"

  # The Windows installers, built as CI builds them, attested, and put on the
  # draft the release job made. Never on a push to release/**: only by hand.
  windows:
    if: inputs.windows
    needs: release
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on the runner: no third-party action in a release job, and no
      # cache, which another workflow's run could have written.
      - name: Rust, with the ARM64 target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-pc-windows-msvc
          rustup default stable
          rustc --version
      - name: Tauri's command line
        env:
          RUSTFLAGS: ""
        run: cargo install tauri-cli --version 2.12.5 --locked
      # Each installer is signed for the app's updater (its .sig beside it),
      # and latest.json says where they are: what the installed app reads
      # from the latest published release (docs/RELEASING.md).
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set: no update could be checked"; exit 1; }
          app-windows/build.sh
          app-windows/build.sh aarch64-pc-windows-msvc
          mkdir -p build/windows
          cp app-windows/src-tauri/target/*-pc-windows-msvc/release/bundle/nsis/*-setup.exe{,.sig} build/windows/
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app-windows/feed.sh "$version" build/windows > build/windows/latest.json
          cd build/windows && sha256sum *-setup.exe > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt latest.json
      # Tauri signs with any key it's given, warning only when it isn't the one
      # in tauri.conf.json: installed copies would be offered an update they
      # refuse. Each signature in the feed is checked with the app's key.
      - name: Check the feed's signatures with the app's key
        working-directory: app-windows/src-tauri
        run: |
          MDIF_FEED="$GITHUB_WORKSPACE/build/windows/latest.json" \
            cargo test --locked -- --ignored the_release_feed_is_signed_with_the_apps_key --nocapture
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/windows/*-setup.exe
      - name: Put them on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          # A published release's files are what people downloaded.
          [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ] \
            || { echo "::error::$tag isn't a draft: bump the version for a new build"; exit 1; }
          gh release upload "$tag" --clobber build/windows/*-setup.exe build/windows/*-setup.exe.sig \
            build/windows/latest.json build/windows/SHA256SUMS-windows.txt
          gh release view "$tag" --json url,assets --jq '"\(.url): \([.assets[].name] | join(", "))"'

  # MyDiskIsFull Lite, for TestFlight and the Mac App Store. The build number
  # comes from the version (0.1.2 is 102), so each version uploads once.
  app-store:
    if: github.event_name == 'push' || inputs.lite
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Use Xcode 26 or later if the runner has it
        run: |
          # A released Xcode, never a beta or a release candidate.
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Import the App Store identities into a throwaway keychain
        env:
          APP_P12_BASE64: ${{ secrets.MAS_APP_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.MAS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/store.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          for id in APP INSTALLER; do
            var="${id}_P12_BASE64"
            printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/$id.p12"
            security import "$RUNNER_TEMP/$id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$id.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p basic "$KEYCHAIN"

      # altool reads the key only from ~/.appstoreconnect/private_keys.
      - name: Write the App Store Connect key and the profile
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/lite.provisionprofile"

      - name: Build, sign, validate and upload Lite
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_BUNDLE_ID: ${{ vars.APP_STORE_BUNDLE_ID }}
          APP_STORE_PROFILE: ${{ runner.temp }}/lite.provisionprofile
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_RUN: ${{ github.run_number }} # 0.1.2 → 102.<run>: a branch may run again
        run: app/app-store.sh --upload

      - name: Remove the keys
        if: always()
        run: rm -rf ~/.appstoreconnect "$RUNNER_TEMP/lite.provisionprofile"
