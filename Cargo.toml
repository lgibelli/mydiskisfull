[workspace]
resolver = "3"
members = ["crates/mdif-macos", "crates/mdif-core", "crates/mdif-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

# Versions pinned to what is already in the local cargo cache, so the
# workspace builds with `cargo --offline` (see PLAN.md).
[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.190"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue"] }
plist = "1.10.1"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"

mdif-core = { path = "crates/mdif-core" }
mdif-macos = { path = "crates/mdif-macos" }
