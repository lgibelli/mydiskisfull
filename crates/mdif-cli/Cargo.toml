[package]
name = "mdif-cli"
description = "Command-line front end for MyDiskIsFull"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mdif"
path = "src/main.rs"

# The same program with no console window, for what starts at login on
# Windows (build.rs gives it the GUI subsystem): `mdif watch --quiet --log`.
[[bin]]
name = "mdif-watch"
path = "src/watch_main.rs"
test = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
mdif-core.workspace = true
